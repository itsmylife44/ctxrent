name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --include=dev

      - name: the tag matches package.json
        run: |
          node -e "
            const version = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (version !== tag) {
              console.error('tag ' + tag + ' does not match package.json version ' + version);
              process.exit(1);
            }
          "

      - name: repository is set, provenance needs it
        run: |
          node -e "
            const p = require('./package.json');
            const url = typeof p.repository === 'string' ? p.repository : p.repository && p.repository.url;
            if (!url || url.includes('OWNER')) {
              console.error('Set the repository field in package.json before publishing');
              process.exit(1);
            }
          "

      - run: npm test
      - run: npm run typecheck
      - run: npm pack

      # The GitHub release comes before npm on purpose: it is what makes the CLI
      # installable from the repository, and it must not depend on npm credentials.
      - name: attach the tarball to a release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ctxrent-*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: is an npm token configured?
        id: npm
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not set, so the package is not published to npm."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish to npm
        if: steps.npm.outputs.set == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
