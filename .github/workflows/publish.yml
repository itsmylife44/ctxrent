name: publish

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Builds and tests with a read-only token; the tarball it uploads is the one file both channels ship.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: the tag matches package.json
        run: |
          node -e "
            const version = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (version !== tag) {
              console.error('tag ' + tag + ' does not match package.json version ' + version);
              process.exit(1);
            }
          "

      - run: npm ci --include=dev
      - run: npm test
      - run: npm run typecheck
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: ctxrent-*.tgz
          if-no-files-found: error

  # The GitHub release comes before npm on purpose: the skill runs the CLI from this release,
  # and it must not depend on npm credentials.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
      - name: attach the tarball to a release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ctxrent-*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball

      - name: is an npm token configured?
        id: npm
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not set: the GitHub release is the only channel for this version."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The same bytes as the release asset: publishing the tarball skips prepack and a rebuild.
      - name: publish to npm
        if: steps.npm.outputs.set == 'true'
        run: npm publish ./ctxrent-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
