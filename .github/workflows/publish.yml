name: publish

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Builds and tests with a read-only token; the tarball it uploads is the one file both channels ship.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: the tag matches package.json
        run: |
          node -e "
            const version = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (version !== tag) {
              console.error('tag ' + tag + ' does not match package.json version ' + version);
              process.exit(1);
            }
          "

      - run: npm ci --include=dev
      - run: npm test
      - run: npm run typecheck
      - run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tarball
          path: ctxrent-*.tgz
          if-no-files-found: error

  # The GitHub release keeps the tarball next to the source; npm is what the skill runs.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarball
      - name: attach the tarball to a release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ctxrent-*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tarball

      # Trusted publishing: npm trusts this workflow through OIDC, so there is no token to leak or renew.
      # A version already on npm (the first one is published by hand) is not published twice.
      - name: publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "ctxrent@${version}" version >/dev/null 2>&1; then
            echo "ctxrent@${version} is already on npm"
          else
            npm publish ./ctxrent-*.tgz --provenance --access public
          fi
